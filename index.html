<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allium</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
</head>
<body hx-boost="true">
    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="banner.mp4" type="video/mp4">
        </video>
    </div>

    <main class="content-wrapper">
        <div class="glass-card">
            <img src="pfp.png" alt="Profile Picture" class="profile-image">
            <h1 class="username">Allium</h1>

            <section class="info-section">
                <h2>About Me</h2>
                <p>♡ Emily • She/They Music Producer your vibe decides mine. MDNI • Don't be weird.</p>
            </section>

            <section class="info-section">
                <h2>Allium Bot</h2>
                <p>Add the bot to your server.</p>
                <a href="https://discord.com/oauth2/authorize?client_id=1535050287625019482" class="action-button">Add to Discord</a>
            </section>

            <footer class="legal-links">
                <a href="tos.html">Terms of Service</a>
                <a href="privacy.html">Privacy Policy</a>
            </footer>
        </div>
    </main>

    <div id="audio-container" hx-preserve="true">
        <audio id="bg-audio" src="music.mp3" loop></audio>
        <button id="play-btn">Play</button>
        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.2">
    </div>

    <script src="script.js"></script>
</body>
</html>
